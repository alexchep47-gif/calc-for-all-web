            {toast && (
              <div className="fixed bottom-6 right-6 z-50 max-w-md bg-slate-900 text-white p-4 rounded-2xl shadow-2xl border border-slate-700 flex items-start gap-3 animate-slide-up">
                <div className="w-9 h-9 rounded-xl bg-blue-600/30 text-blue-400 flex items-center justify-center text-xl shrink-0 mt-0.5">
                  🌐
                </div>
                <div className="flex-1">
                  <h4 className="font-bold text-sm text-white mb-0.5">{toast.title}</h4>
                  <p className="text-xs text-slate-300 leading-relaxed">{toast.message}</p>
                </div>
                <button
                  onClick={() => setToast(null)}
                  className="text-slate-400 hover:text-white text-base font-bold ml-1"
                >
                  ✕
                </button>
              </div>
            )}

            {/* Modale de détails du module */}
            {selectedModule && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100">
                  <button
                    onClick={() => setSelectedModule(null)}
                    className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold"
                  >
                    ×
                  </button>

                  <div className="flex items-center gap-4 mb-4">
                    <div
                      className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl"
                      style={{ backgroundColor: `${selectedModule.color}15`, color: selectedModule.color }}
                    >
                      {selectedModule.icon}
                    </div>
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                        {selectedModule.category}
                      </span>
                      <h3 className="text-xl font-extrabold text-slate-900">{selectedModule.title}</h3>
                    </div>
                  </div>

                  <p className="text-slate-600 text-sm leading-relaxed mb-4">{selectedModule.fullDesc}</p>

                  <div className="bg-slate-50 border-l-4 p-4 rounded-r-xl mb-6" style={{ borderLeftColor: selectedModule.color }}>
                    <div className="text-xs font-bold text-slate-500 uppercase mb-1">Exemple / Formule :</div>
                    <code className="text-sm font-mono font-bold text-slate-900">{selectedModule.example}</code>
                  </div>

                  <div className="flex items-center justify-between border-t border-slate-100 pt-4">
                    <span className="text-xs text-slate-500">
                      🎓 Cours sur <a href="https://cmr-school.online" target="_blank" rel="noopener noreferrer" className="text-blue-700 font-semibold">cmr-school.online</a>
                    </span>
                    <a
                      href={appLink}
                      target="_blank"
                      rel="noopener noreferrer"
                      onClick={() => {
                        handleDownloadClick();
                        setSelectedModule(null);
                      }}
                      className="px-4 py-2 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs"
                    >
                      Essayer l'application Calc for all
                    </a>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Calc For All - Calculatrice scientifique et etude de fonctions hors-ligne.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Calc For All">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calc For All 3.1.0</title>
  <link rel="manifest" href="manifest.json">

  <script src="tesseract_ocr.js"></script>
</head>
<body>
  <div id="calc-loading" style="font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;color:#1565C0">
    Chargement de Calc For All 3.1.0…
  </div>
  <script>
    // Force purge of old Flutter PWA / caches that kept v2.7 alive
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(function (name) {
            return caches.delete(name);
          }));
        }
      } catch (_) {}
    })();
  </script>
  <script src="flutter_bootstrap.js?v=d2408d95e2914dfbbb70122d73a9accf24bbe50f" async></script>
  <script>
    window.setTimeout(function () {
      var loading = document.getElementById('calc-loading');
      if (loading) loading.remove();
    }, 8000);
  </script>
</body>
</html>
